<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UI harness</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#05070d; color:#e8f2ff;
        font-family: 'Rajdhani','Eurostile','Bahnschrift','DIN Alternate','Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased; }
      #app { position: fixed; inset: 0; }
      canvas#viewport { position:absolute; inset:0; width:100%; height:100%; display:block; }
      #ui-root { position:absolute; inset:0; pointer-events:none; user-select:none; }
      #ui-root > * { pointer-events: none; }
      #ui-root [data-interactive] { pointer-events: auto; }
      #boot { position: fixed; left: 8px; top: 8px; color:#9cf; font: 12px monospace; z-index: 99; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <div id="ui-root"></div>
      <div id="boot">starting…</div>
    </div>
    <script type="module" src="/ui-scene.tmp.ts"></script>
  </body>
</html>
