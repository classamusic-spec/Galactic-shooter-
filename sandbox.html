<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Combat sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden;
        font-family: 'Rajdhani','Bahnschrift','Segoe UI',system-ui,sans-serif; color:#e8f2ff; }
      #viewport { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; }
      #ui-root [data-interactive] { pointer-events: auto; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center;
              color: #9cf; font: 13px monospace; background: #05070d; z-index: 50; }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="ui-root"></div>
    <div id="boot"><div id="boot-label">starting…</div></div>
    <script type="module" src="/tools/critic/sandbox.ts"></script>
  </body>
</html>
